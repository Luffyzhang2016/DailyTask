<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#a90039">
  <meta name="description" content="每天都清楚，完成有回响。">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/app-icon.svg">
  <style>html,body{background:#a90039}</style>
  <link rel="stylesheet" href="styles.css">
  <title>日程 · 每日任务</title>
</head>
<body>
  <a class="skip-link" href="#task-list">跳到任务列表</a>
  <div class="splash-screen" id="splash-screen" aria-hidden="true">
    <div class="splash-logo">
      <svg viewBox="0 0 160 160" role="img" aria-label="日程">
        <circle class="splash-orbit" cx="80" cy="80" r="61"></circle>
        <circle class="splash-eye splash-eye-left" cx="59" cy="59" r="7"></circle>
        <circle class="splash-eye splash-eye-right" cx="101" cy="59" r="7"></circle>
        <path class="splash-smile" d="M45 91c5 20 19 31 35 31s30-11 35-31"></path>
      </svg>
      <div class="splash-wordmark">日程</div>
      <p>每天都清楚，完成有回响</p>
    </div>
  </div>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="日程首页">
        <span class="brand-mark" aria-hidden="true">⌣</span><span>日程</span>
      </a>
      <div class="top-actions">
        <div class="theme-switcher" aria-label="选择主题" role="group">
          <button data-theme-choice="morning" aria-label="晨光主题" aria-pressed="true"><span class="theme-icon" aria-hidden="true">☼</span><span>晨光</span></button>
          <button data-theme-choice="focus" aria-label="专注主题" aria-pressed="false"><span class="theme-icon" aria-hidden="true">◎</span><span>专注</span></button>
          <button data-theme-choice="night" aria-label="夜航主题" aria-pressed="false"><span class="theme-icon" aria-hidden="true">☾</span><span>夜航</span></button>
        </div>
        <button class="icon-button account-button" id="account-button" aria-label="账户与同步"><span aria-hidden="true">我</span></button>
      </div>
    </header>

    <main class="workspace">
      <section class="calendar-panel" id="calendar-view" aria-labelledby="calendar-heading">
        <div class="panel-heading">
          <h1 id="calendar-heading"></h1>
          <div class="month-controls">
            <button class="icon-button" id="prev-month" aria-label="上个月">‹</button>
            <button class="text-button" id="today-button">今天</button>
            <button class="icon-button" id="next-month" aria-label="下个月">›</button>
          </div>
        </div>
        <div class="weekday-row" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
        <div class="calendar-grid" id="calendar-grid" role="grid" aria-label="月历"></div>
        <div class="calendar-legend"><span><i class="smile-mini" aria-hidden="true">⌣</i> 全部完成</span><span><i class="dot-mini" aria-hidden="true"></i> 有任务</span></div>
      </section>

      <section class="tasks-panel" id="today-view" aria-labelledby="selected-date-heading">
        <div class="day-header">
          <div>
            <p class="date-context" id="date-context"></p>
            <h1 id="selected-date-heading"></h1>
          </div>
          <button class="icon-button" id="add-task-top" aria-label="添加任务">＋</button>
        </div>
        <div class="progress-block" aria-live="polite">
          <div class="progress-copy"><strong id="progress-count">0 / 0</strong><span>已完成</span><span class="complete-message" id="complete-message" hidden>今天做得很好 <i aria-hidden="true">⌣</i></span></div>
          <div class="progress-track" role="progressbar" aria-label="今日任务进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-bar"></span></div>
        </div>
        <p class="date-policy" id="date-policy" hidden></p>

        <div id="task-list" tabindex="-1">
          <section class="task-group" aria-labelledby="repeat-heading">
            <div class="group-heading"><h2 id="repeat-heading">重复任务</h2><span id="repeat-count"></span></div>
            <div class="task-rows" id="repeat-list"></div>
          </section>
          <section class="task-group" aria-labelledby="specific-heading">
            <div class="group-heading"><h2 id="specific-heading">指定日期任务</h2><span id="specific-count"></span></div>
            <div class="task-rows" id="specific-list"></div>
          </section>
        </div>
        <div class="empty-state" id="empty-state" hidden>
          <span class="empty-mark" aria-hidden="true">＋</span>
          <h2>这一天还没有任务</h2>
          <p>添加一项任务，为今天留一个清楚的落点。</p>
          <button class="primary-button" id="empty-add">添加任务</button>
        </div>
        <button class="add-task-button" id="add-task-bottom"><span aria-hidden="true">＋</span> 添加任务</button>
      </section>
    </main>

    <nav class="mobile-nav" aria-label="主导航">
      <button data-mobile-view="today" aria-current="page"><span aria-hidden="true">✓</span><span>今天</span></button>
      <button data-mobile-view="calendar"><span aria-hidden="true">▦</span><span>日历</span></button>
    </nav>
  </div>

  <dialog id="task-dialog" class="sheet-dialog" aria-labelledby="task-dialog-title">
    <form method="dialog" id="task-form">
      <div class="dialog-heading"><div><p class="date-context">任务设置</p><h2 id="task-dialog-title">添加任务</h2></div><button class="icon-button" type="button" id="close-task-dialog" aria-label="关闭">×</button></div>
      <input type="hidden" id="task-id">
      <label>任务名称<input id="task-title" name="title" required maxlength="80" autocomplete="off" placeholder="例如：整理明日计划"></label>
      <fieldset><legend>任务类型</legend><div class="segmented"><label><input type="radio" name="task-type" value="repeat" checked><span>重复任务</span></label><label><input type="radio" name="task-type" value="specific"><span>指定日期任务</span></label></div></fieldset>
      <fieldset id="repeat-rule-field"><legend>重复方式</legend><div class="segmented"><label><input type="radio" name="repeat-mode" value="daily" checked><span>每日重复</span></label><label><input type="radio" name="repeat-mode" value="interval"><span>区间重复</span></label></div></fieldset>
      <div class="date-range" id="repeat-range" hidden><label>开始日期<input id="repeat-start" type="date"></label><label>结束日期<input id="repeat-end" type="date"></label></div>
      <label id="date-field" hidden>执行日期<input id="task-date" name="date" type="date"></label>
      <label>完成截止时间 <span class="optional">可选</span><input id="task-deadline" name="deadline" type="time" step="300" inputmode="numeric"></label>
      <p class="form-error" id="task-error" role="alert" hidden></p>
      <div class="dialog-actions"><button class="danger-button" type="button" id="delete-task" hidden>删除任务</button><span></span><button class="secondary-button" type="button" id="cancel-task-dialog">取消</button><button class="primary-button" type="submit">保存任务</button></div>
    </form>
  </dialog>

  <dialog id="account-dialog" class="sheet-dialog" aria-labelledby="account-title">
    <form method="dialog" id="account-form">
      <div class="dialog-heading"><div><p class="date-context">账户与同步</p><h2 id="account-title">登录日程</h2></div><button class="icon-button" type="button" id="close-account-dialog" aria-label="关闭">×</button></div>
      <section id="login-view">
        <p class="dialog-intro">选择 GitHub 或 Google 验证身份，登录后即可在不同设备同步任务。</p>
        <div class="oauth-options" aria-label="登录方式">
        <button class="oauth-button github-button" type="button" id="github-login"><span aria-hidden="true">GH</span> 使用 GitHub 登录</button>
        <button class="oauth-button google-button" type="button" id="google-login"><span aria-hidden="true">G</span> 使用 Google 登录</button>
        </div>
        <p class="sync-note" id="sync-note" role="status">登录服务仅用于确认账户身份，任务数据仍保存在你的私有阿里云 OSS 中。</p>
        <div class="dialog-actions compact-actions"><span></span><button class="secondary-button" type="button" id="cancel-account-login">暂不登录</button></div>
      </section>
      <section id="profile-view" hidden>
        <div class="profile-summary"><button class="profile-avatar-button" id="profile-avatar-button" type="button" aria-label="更换头像" aria-expanded="false"><img id="profile-avatar" alt="" hidden><span id="profile-avatar-fallback" aria-hidden="true">我</span><span class="avatar-edit-mark" aria-hidden="true">✎</span></button><div><strong id="profile-display-name"></strong><p id="profile-provider"></p><button class="avatar-text-button" id="change-avatar-button" type="button">更换头像</button></div></div>
        <label>昵称<input id="profile-nickname" maxlength="40" autocomplete="nickname"></label>
        <fieldset><legend>性别 <span class="optional">可选</span></legend><div class="segmented"><label><input type="radio" name="profile-gender" value="female"><span>女</span></label><label><input type="radio" name="profile-gender" value="male"><span>男</span></label></div></fieldset>
        <label>账户<input id="profile-account" readonly></label>
        <fieldset class="avatar-field" id="avatar-field" hidden><legend>选择头像</legend><div class="avatar-grid" id="avatar-grid" aria-label="内置卡通头像"></div><div class="upload-row"><label class="secondary-button upload-button" for="avatar-upload">使用本地图片</label><input id="avatar-upload" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" hidden><span id="avatar-size-note">图片会自动压缩后保存</span></div></fieldset>
        <p class="sync-note">个人资料和任务会同步到你的私有 OSS 空间。</p>
        <div class="dialog-actions profile-actions"><span></span><button class="secondary-button" type="button" id="cancel-profile">取消</button><button class="primary-button" type="submit">保存资料</button></div>
        <button class="logout-button" type="button" id="logout-button">退出登录</button>
      </section>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
